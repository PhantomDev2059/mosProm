<div id="intro" class="intro" hidden>
  <canvas></canvas>
  <div class="intro-word">
    <div class="wm"><b>LinQ</b><span>Guard</span></div>
    <div class="tape"></div>
    <div class="tag">контроль промбезопасности на&nbsp;LinQ&nbsp;TPU</div>
  </div>
  <button class="intro-skip" type="button">пропустить →</button>
</div>

<div id="roles" class="roles" hidden></div>

<div id="app" class="app" hidden>
  <header id="hdr" class="hdr">
    <canvas id="hdrArt" aria-hidden="true"></canvas>
    <div class="hdr-in">
      <div class="hdr-row">
        <div class="brand">
          <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 7h7v5H4z"/><path d="M11 9.5 25 4v17L11 13" class="cone"/><circle cx="6" cy="9.5" r=".9" class="led"/><path d="M4 23h20" class="base"/></svg>
          <div><b>LinQ</b> Guard</div>
        </div>
        <button id="roleBtn" class="role-chip" type="button" hidden><svg><use href="#i-swap"/></svg><span></span></button>
      </div>
      <div class="hdr-shift">
        <span id="shiftLbl" class="mono">смена —</span>
        <span id="alarmPill" class="alarm-pill" hidden></span>
      </div>
      <div class="ruler" id="ruler"><i></i><b></b></div>
    </div>
  </header>
  <main id="view" class="view"></main>
  <nav id="tabs" class="tabs"></nav>
</div>

<div id="gate" class="gate" hidden></div>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>

<script src="art.js?v=5"></script>
